services:
  posdb:
    image: postgres:13
    container_name: posdb
    restart: always
    ports:
      - "5432:5432"
    expose:
      - 5432
    env_file:
      - .env
    volumes:
      - posdb:/var/lib/postgresql/data
    networks:
      - pos-networks

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    container_name: pgadmin
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - posdb
    networks:
      - pos-networks

