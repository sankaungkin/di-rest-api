services:
  posdb:
    image: postgres:13
    container_name: posdb
    restart: always
    ports:
      - "5432:5432"
    expose:
      - 5432
    env_file:
      - .env
    volumes:
      - posdb:/var/lib/postgresql/data
    networks:
      - pos-networks

  adminer:
    image: adminer
    restart: always
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: posdb
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - posdb
    networks:
      - pos-networks

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    container_name: pgadmin
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - posdb
    networks:
      - pos-networks

  backend-dev:
    build:
      context: . # adjust this if your Dockerfile is elsewhere
      dockerfile: Dockerfile # make sure the file is named correctly
    container_name: backend-dev
    restart: always
    ports:
      - "5555:5555" # or whatever your Go server uses
    env_file:
      - .env # make sure this exists
    depends_on:
      - posdb
    networks:
      - pos-networks

volumes:
  posdb:

networks:
  pos-networks:
